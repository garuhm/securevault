services:
  securevault-db:
    image: postgres:18.3
    container_name: securevault-db
    environment:
      POSTGRES_DB: securevault
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: securevault
    ports:
      - "5000:5432"
    volumes:
      - db:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db:
