server:
  port: 8000

spring:
  application:
    name: securevault

  datasource:
    url: jdbc:postgresql://localhost:5000/securevault
    username: securevault
    password: securevault

  data:
    redis:
      host: localhost
      port: 6000

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${security.keycloak.auth-server-url}/realms/${security.keycloak.realm}

  kafka:
    bootstrap-servers: localhost:9000
    consumer:
      group-id: securevault
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.roadmap.securevault.kafka.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

security:
  keycloak:
    realm: app-realm
    auth-server-url: http://localhost:8001
    service-client-id: backend-client
    service-client-secret: ${KEYCLOAK_CLIENT_SECRET}